name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard (khóa bí mật, hợp đồng useApp, CSP)
        run: npm run guard
      - name: Kiểm tra type
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Kiểm thử schema + RLS (Postgres chạy trong Node)
        working-directory: supabase/tests
        run: |
          npm ci
          npm test
